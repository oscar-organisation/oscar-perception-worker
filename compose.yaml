name: oscar-perception

services:
  perception-worker:
    build:
      context: .
      args:
        # Hote sans GPU : roues CPU. Vider cet argument sur une cible Jetson.
        TORCH_INDEX_URL: ${OSCAR_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: oscar/perception-worker:local
    restart: unless-stopped
    deploy:
      replicas: 2
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - ${OSCAR_PERCEPTION_ENV_FILE:-worker.env}
    volumes:
      - perception-models:/var/lib/oscar/models
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      # Le média WebRTC doit joindre le SFU directement. Passer par le nom
      # public depuis le même hôte laisse la signalisation réussir et
      # l'abonnement aux pistes échouer en silence.
      - default
      - sfu

volumes:
  perception-models:

networks:
  sfu:
    external: true
    name: ${OSCAR_SFU_NETWORK:-proxy-network}
